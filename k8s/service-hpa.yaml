apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: mindmeld
data:
  # Populated from Terraform output: redis_primary_endpoint
  redis_host: "${REDIS_HOST}"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mindmeld
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: mindmeld
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # Prevent flapping
    scaleUp:
      stabilizationWindowSeconds: 60
